name: Build Windows

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore Launcher.sln

      - name: Publish single executable
        run: dotnet publish src/Ideo.TopSolidLauncher/Ideo.TopSolidLauncher.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:DebugType=None -o publish

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: Launcher-Windows-x64
          path: publish/Launcher.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub release v0.2.0
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release create v0.2.0 publish/Launcher.exe --target ${{ github.sha }} --title "Launcher TopSolid v0.2.0" --notes "Mise à jour automatique, contrôle d'intégrité SHA-256 et diagnostic intégré."
