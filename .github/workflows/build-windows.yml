name: Build Windows

on:
  push:
    branches:
      - main
      - "feature/**"
      - "fix/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore Launcher.sln

      - name: Publish single executable
        run: dotnet publish src/Ideo.TopSolidLauncher/Ideo.TopSolidLauncher.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:DebugType=None -o publish

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: Launcher-Windows-x64
          path: publish/Launcher.exe
          if-no-files-found: error
          retention-days: 30


  release:
    if: github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, 'release-v0.3.0')
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Download executable
        uses: actions/download-artifact@v4
        with:
          name: Launcher-Windows-x64
          path: publish

      - name: Publish GitHub release v0.3.0
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release create v0.3.0 publish/Launcher.exe --repo ${{ github.repository }} --target ${{ github.sha }} --title "Idéo Launcher v0.3.0" --notes "Nouvelle interface Idéo et catalogue générique : cartes, groupes, tags, filtres multi-sélection, favoris, vues enregistrées, import de raccourcis, sauvegardes et partage du catalogue."
